# render.yaml - Blueprint for one-click deployment on Render

services:
  # ─── BACKEND WEB SERVICE ──────────────────────────────────
  - type: web
    name: ironclaw-backend
    runtime: python
    repo: https://github.com/feranmiabiola1002/ironclaw-backend
    branch: main
    plan: free
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.11.0
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      gunicorn backend:app -k eventlet -w 1
    healthCheckPath: /
    autoDeploy: true
